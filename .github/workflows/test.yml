name: Test OS

on: [push, pull_request, workflow_dispatch]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3
      - name: Install verified Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-18
          components: rust-src, llvm-tools-preview
      - name: Install bootimage
        working-directory: ${{ runner.temp }}
        run: cargo install bootimage --version 0.10.5 --locked
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - name: Build userspace and kernel image
        run: bash scripts/build.sh
      - name: Native regression tests
        run: bash scripts/test-native.sh
      - name: Boot, process, IPC and persistent-storage acceptance
        run: python3 scripts/boot-test.py --accel tcg --output test-results/ci
      - name: Interrupted virtio writes and flush recovery
        run: python3 scripts/test-storage-recovery.py --accel tcg --output test-results/ci-recovery
      - name: Reusable interactive console and disk
        run: python3 scripts/test-console.py --accel tcg --output test-results/ci-console
      - name: Retain diagnostics even when acceptance fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atom-os-test-results
          path: |
            test-results/ci/
            test-results/ci-recovery/
            test-results/ci-console/
            target/native-tests/compile.log
          retention-days: 7

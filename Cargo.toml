[workspace]
members = ["daemon", "user-rt", "worker", "desktop",
    "kernel-kit",
    "kernel-orchestrator", "payload",
    "x86_64-kernel",
]
exclude = ["runner"]
resolver = "2"

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
lto = false
panic = "abort"

[profile.release.package.bootloader]
opt-level = 1

[workspace]
members = ["daemon", "user-rt", "worker", "desktop",
    "kernel-kit", "kernel-lightcone",
    "kernel-orchestrator", "kernel-sense", "kernel-key", "kernel-instant", "kernel-egress", "kernel-lane", "kernel-taint", "kernel-crypt", "kernel-net", "payload",
    "x86_64-kernel",
]
# bootloader/ is the from-scratch atom-bootloader (Lucerna-Labs line); it is not
# used to build the boot image yet, so it stays outside the workspace.
exclude = ["runner", "bootloader"]
resolver = "2"

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
lto = false
panic = "abort"

[profile.release.package.bootloader]
opt-level = 1

[workspace.metadata.bootimage]
# Tell bootimage which workspace member is the kernel binary.
kernel-package = "x86_64-kernel"

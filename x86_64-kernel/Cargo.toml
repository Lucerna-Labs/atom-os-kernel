[package]
name = "x86_64-kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader = { version = "0.9.23", features = ["map_physical_memory", "vga_320x200"] }
kernel-kit = { path = "../kernel-kit" }
kernel-orchestrator = { path = "../kernel-orchestrator" }
kernel-net = { path = "../kernel-net" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
